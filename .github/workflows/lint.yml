name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Stable toolchain for building and clippy, version and components from rust-toolchain.toml.
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1.16.0

      - name: Cache Cargo artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install taplo
        run: cargo install taplo-cli --version 0.10.0 --locked  # v0.10.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked  # v0.19.4

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked  # v0.9.2

      # Nightly toolchain for rustfmt only, version from [fmt] in rust-toolchain.toml.
      - name: Install Nightly Toolchain (fmt)
        run: ./hooks/fmt.sh --install

      - name: Check Rust formatting
        id: fmt
        continue-on-error: true
        run: ./hooks/fmt.sh -- --check

      - name: Audit dependencies
        id: deny
        continue-on-error: true
        run: >
          cargo deny
          --manifest-path rust/Cargo.toml
          --locked
          --all-features
          check
          --hide-inclusion-graph
          -c .cargo-deny.toml
          --show-stats
          -D warnings

      - name: Check TOML formatting
        id: taplo-fmt
        continue-on-error: true
        run: taplo fmt --check

      - name: Lint TOML
        id: taplo-lint
        continue-on-error: true
        run: taplo lint

      - name: Check unused dependencies
        id: machete
        continue-on-error: true
        run: cargo machete rust/

      - name: Report
        if: always()
        run: |
          pass="✅" fail="❌"
          failed=false

          check() {
            local name="$1" outcome="$2"
            if [ "$outcome" = "success" ]; then
              echo "$pass $name"
            else
              echo "$fail $name ($outcome)"
              failed=true
            fi
          }

          check "rustfmt"       "${{ steps.fmt.outcome }}"
          check "cargo-deny"    "${{ steps.deny.outcome }}"
          check "taplo fmt"     "${{ steps.taplo-fmt.outcome }}"
          check "taplo lint"    "${{ steps.taplo-lint.outcome }}"
          check "cargo-machete" "${{ steps.machete.outcome }}"

          $failed && exit 1 || true

  zizmor:
    name: Check Workflows with zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Fails on any finding. Accepted ones carry `# zizmor: ignore[...]` where they occur, with the reason.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
