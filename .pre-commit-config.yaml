repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: eeee35a89e69d5772bdee97db1a6a898467b686e # 1.0
    hooks:
      - id: fmt
        entry: ./hooks/fmt.sh
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path rust/Cargo.toml
        args:
          ["--all", "--all-targets", "--all-features", "--", "-D", "warnings"]
        pass_filenames: false
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: cfe589ec21d70996a3e44d76a8e2b9369f7e0a2f # v0.19.4
    hooks:
      - id: cargo-deny
        args:
          - --manifest-path
          - rust/Cargo.toml
          - --locked
          - --all-features
          - check
          - --hide-inclusion-graph
          - -c
          - .cargo-deny.toml
          - --show-stats
          - -D
          - warnings
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
    hooks:
      - id: cargo-machete
        args: ["rust/"]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: e72a3ca1632f0b11a07d171449fe447a7ff6795e # v0.48.0
    hooks:
      - id: markdownlint
        args: ["-f"]
  - repo: local
    hooks:
      # Taplo runs through a local script instead of `ComPWA/taplo-pre-commit` because that hook installs an outdated
      # version from PyPI, stuck at 0.9.3 (https://github.com/tamasfe/taplo/issues/805), while the CI uses 0.10.0.
      - id: taplo-format
        name: taplo fmt
        language: script
        entry: ./hooks/taplo.sh fmt
        types: [toml]
        require_serial: true
      - id: taplo-lint
        name: taplo lint
        language: script
        entry: ./hooks/taplo.sh lint
        types: [toml]
        require_serial: true
      - id: cargo-hack-check
        language: script
        name: cargo hack check
        entry: ./hooks/cargo-hack.sh
        stages: [manual]
